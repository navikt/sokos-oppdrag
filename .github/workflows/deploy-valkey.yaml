name: Deploy Valkey

on:
  schedule:
    - cron: '0 5 * * 1'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-valkey.yaml'
      - '.nais/valkey/**'

env:
  TZ: Europe/Oslo

jobs:
  build-push-valkey-image:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
       - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # ratchet:step-security/harden-runner@v2.22.4
         with:
          egress-policy: audit

       - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
         with:
          persist-credentials: false

       - name: Build Valkey-image and push to GAR
         id: docker-build-push
         uses: nais/docker-build-push@ceabe305c64640175f133b7e59af6666b0a3c46c # ratchet:nais/docker-build-push@v0
         with:
           team: okonomi
           dockerfile: .nais/valkey/Dockerfile
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

  deploy-dev-q1:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [ build-push-valkey-image ]
    name: Deploy valkey to dev-fss-q1
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@f76a78f10742990ced901927ed5113f6a0803961 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@v1.1.4
    with:
      cluster: dev-fss
      resource: .nais/valkey/valkey-q1.yaml
      image: ${{ needs.build-push-valkey-image.outputs.image }}

  deploy-dev-qx:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [ build-push-valkey-image, deploy-dev-q1 ]
    name: Deploy valkey to dev-fss-qx
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@f76a78f10742990ced901927ed5113f6a0803961 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@v1.1.4
    with:
      cluster: dev-fss
      resource: .nais/valkey/valkey-qx.yaml
      image: ${{ needs.build-push-valkey-image.outputs.image }}

  deploy-prod:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [ build-push-valkey-image, deploy-dev-q1, deploy-dev-qx ]
    name: Deploy valkey to prod-fss
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@f76a78f10742990ced901927ed5113f6a0803961 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/nais-deploy.yaml@v1.1.4
    with:
      cluster: prod-fss
      resource: .nais/valkey/valkey-prod.yaml
      image: ${{ needs.build-push-valkey-image.outputs.image }}