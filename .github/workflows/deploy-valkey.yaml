name: Deploy Valkey

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-valkey.yaml'
      - '.nais/valkey/**'

env:
  TZ: Europe/Oslo

jobs:
  build-push-valkey-image:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
       - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # ratchet:step-security/harden-runner@v2.21.0
         with:
          egress-policy: audit

       - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
         with:
          persist-credentials: false

       - name: Build Valkey-image and push to GAR
         id: docker-build-push
         uses: nais/docker-build-push@8e41f1f58749b9248e376c25d33bfbdd2b1163c0 # ratchet:nais/docker-build-push@v0
         with:
           team: okonomi
           dockerfile: .nais/valkey/Dockerfile
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

  deploy-dev-q1:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [ build-push-valkey-image ]
    name: Deploy valkey to dev-fss-q1
    uses: navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@e80242212870d8674570d82f812590617942930c # ratchet:navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@v1.0.1
    with:
      cluster: dev-fss
      resource: .nais/valkey/valkey-q1.yaml
      image: ${{ needs.build-push-valkey-image.outputs.image }}

  deploy-dev-qx:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [ build-push-valkey-image, deploy-dev-q1 ]
    name: Deploy valkey to dev-fss-qx
    uses: navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@e80242212870d8674570d82f812590617942930c # ratchet:navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@v1.0.1
    with:
      cluster: dev-fss
      resource: .nais/valkey/valkey-qx.yaml
      image: ${{ needs.build-push-valkey-image.outputs.image }}

  deploy-prod:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [ build-push-valkey-image, deploy-dev-q1, deploy-dev-qx ]
    name: Deploy valkey to prod-fss
    uses: navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@e80242212870d8674570d82f812590617942930c # ratchet:navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@v1.0.1
    with:
      cluster: prod-fss
      resource: .nais/valkey/valkey-prod.yaml
      image: ${{ needs.build-push-valkey-image.outputs.image }}