name: CodeQL Scan

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  TZ: Europe/Oslo

jobs:
  codeql-scan:
    permissions:
      contents: read
      security-events: write
    name: CodeQL Scan
    uses: navikt/beregningsplattform-gha-workflows/.github/workflows/codeql-scan.yaml@02ef55dcef76850a0c319cdf705904401e77a002 # ratchet:navikt/beregningsplattform-gha-workflows/.github/workflows/codeql-scan.yaml@v1.1.3
    secrets: inherit
    with:
      language: 'kotlin'